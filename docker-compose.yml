services:
  mysql:
    image: mysql:8.0
    container_name: linkforge-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-linkforge}
      MYSQL_USER: ${MYSQL_USER:-linkforge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - linkforge_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: linkforge-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - linkforge_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: linkforge-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-linkforge}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - linkforge_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # B1 observability stack: opt-in only (`docker compose --profile observability up -d`).
  # Prometheus scrapes the app on the HOST (the app is not containerized), so the
  # scrape token file must hold the same value as LINKFORGE_METRICS_SCRAPE_TOKEN.
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: linkforge-prometheus
    restart: unless-stopped
    profiles: ["observability"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/scrape-token:/etc/linkforge/scrape-token:ro
      - linkforge_prometheus_data:/prometheus

  grafana:
    image: grafana/grafana-oss:11.3.0
    container_name: linkforge-grafana
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      # local-demo default; override GRAFANA_ADMIN_PASSWORD in .env for anything exposed
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-linkforge-local-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - linkforge_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  linkforge_mysql_data:
  linkforge_redis_data:
  linkforge_rabbitmq_data:
  linkforge_prometheus_data:
  linkforge_grafana_data:
