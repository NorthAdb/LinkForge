# Integration-test profile: runs against the real compose stack (MySQL/Redis/RabbitMQ).
# Defaults point at host.docker.internal so the canonical in-container test path works:
#   MSYS_NO_PATHCONV=1 docker run --rm -v "D:/LinkForge:/app" -v linkforge_m2:/root/.m2 -w /app \
#     -e SPRING_DATASOURCE_PASSWORD=... -e SPRING_RABBITMQ_PASSWORD=... -e JWT_SECRET=... \
#     maven:3.9-eclipse-temurin-17 mvn -B test
# Override hosts via the standard SPRING_* env vars when running on the host itself.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://host.docker.internal:3306/linkforge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:linkforge}
    password: ${SPRING_DATASOURCE_PASSWORD:linkforge_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:host.docker.internal}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:host.docker.internal}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:linkforge}
    password: ${SPRING_RABBITMQ_PASSWORD:linkforge_pass}
    listener:
      simple:
        auto-startup: false
        default-requeue-rejected: false
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

linkforge:
  jwt:
    secret: ${JWT_SECRET:linkforge-it-test-secret-0123456789abcdef}
    expire-hours: 1
  short-link:
    cache-ttl-seconds: 3600
    code-length: 7
  mq:
    async-click-enabled: false
    sync-click-enabled: true
    reconcile-fixed-delay-ms: 3600000
    reconcile-initial-delay-ms: 3600000
  bootstrap:
    enabled: false
    password: ${LINKFORGE_BOOTSTRAP_PASSWORD:it-not-used}
  rate-limit:
    register-max: ${LINKFORGE_REGISTER_MAX:1000}
    register-window-seconds: 600
    key-prefix: "linkforge:rl:it-default:"

logging:
  level:
    com.linkforge: WARN
