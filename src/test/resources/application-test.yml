# Integration-test profile. Connection settings (MySQL/Redis/RabbitMQ) are injected
# per-JVM by AbstractIntegrationTest from Testcontainers singletons; nothing here or
# below points at a host Compose stack. Values below are non-connection defaults.
spring:
  rabbitmq:
    # same confirm posture as dev: relay delivery in ITs runs the ack path
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        auto-startup: false
        default-requeue-rejected: false
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

linkforge:
  jwt:
    secret: ${JWT_SECRET:linkforge-it-test-secret-0123456789abcdef}
    expire-hours: 1
  short-link:
    cache-ttl-seconds: 3600
    code-length: 7
  mq:
    async-click-enabled: false
    sync-click-enabled: true
    reconcile-fixed-delay-ms: 3600000
    reconcile-initial-delay-ms: 3600000
  bootstrap:
    enabled: false
    password: ${LINKFORGE_BOOTSTRAP_PASSWORD:it-not-used}
  rate-limit:
    register-max: ${LINKFORGE_REGISTER_MAX:1000}
    register-window-seconds: 600
    key-prefix: "linkforge:rl:it-default:"
  webhook:
    enabled: true
    # fixed 32-byte test master key (Base64) — ITs rely on AES-GCM round-trip
    secret-master-key: "bGlua2ZvcmdlLWl0LXdlYmhvb2stbWFzdGVyLWtleSE="
    # only WebhookDeliveryIT enables the relay; sibling contexts must not
    # race-drain the shared lf_webhook_delivery with a stricter SSRF guard
    relay-enabled: false
    relay-fixed-delay-ms: 500
    relay-initial-delay-ms: 500
    relay-batch-size: 50
    backoff-base-seconds: 1
    backoff-max-seconds: 2

logging:
  level:
    com.linkforge: WARN
