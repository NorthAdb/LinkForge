spring:
  application:
    name: linkforge
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  task:
    scheduling:
      # B5: relays must not share one thread — a slow webhook endpoint must never
      # delay click outbox catch-up. B9 adds the blocklist reload and B1 the backlog
      # sampler (D-Bw345-54: 4 → 6).
      pool:
        size: ${LINKFORGE_SCHEDULING_POOL_SIZE:6}
  flyway:
    # Versioned migrations for every profile; empty DBs get V1, legacy volumes
    # (tables already present, no history) are baselined at 1 and skip V1.
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus   # B1: scrape endpoint, token-gated (D-Bw345-42)
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    tags:
      application: linkforge                      # B1: common tag on every meter
    enable:
      # the only instrumented client in this app is the test harness's RestTemplate
      # (the webhook relay uses a raw java.net.http.HttpClient); client-side meters
      # would record raw request paths of tests into the export — off for good
      http.client.requests: false
    distribution:
      percentiles-histogram:
        # only this meter gets buckets — the redirect SLO panel needs the latency distribution
        http.server.requests: true
      slo:
        http.server.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/linkforge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:linkforge}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:linkforge}
    password: ${SPRING_RABBITMQ_PASSWORD}
    # A7 audit S1: correlated confirms + mandatory returns; the outbox relay marks
    # SENT only after the broker acks.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # Consumer runs by default now that the real consumer is in place.
        auto-startup: ${LINKFORGE_MQ_LISTENER_AUTO_STARTUP:true}
        # Errored messages go to the dead-letter queue instead of hot-looping.
        default-requeue-rejected: ${LINKFORGE_MQ_DEFAULT_REQUEUE_REJECTED:false}
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: ${SERVER_PORT:8080}


linkforge:
  jwt:
    secret: ${JWT_SECRET}
    expire-hours: ${JWT_EXPIRE_HOURS:24}
  short-link:
    # Redis key: linkforge:code:{code} -> originalUrl; TTL = base + uniform [0, jitter]
    cache-ttl-seconds: 3600
    cache-ttl-jitter-seconds: ${LINKFORGE_CACHE_TTL_JITTER_SECONDS:300}
    # B7: negative cache for codes the DB confirms absent (never disables/expiry);
    # linkforge:absent:{code}, <=0 disables. Keeps Bloom-off/missed codes off the DB.
    absent-ttl-seconds: ${LINKFORGE_ABSENT_TTL_SECONDS:60}
    absent-ttl-jitter-seconds: ${LINKFORGE_ABSENT_TTL_JITTER_SECONDS:30}
    code-length: 7
  bloom:
    # A9: process-local Guava Bloom over short codes; a negative answer 404s the
    # redirect before MySQL. False positives (fpp) just fall through to cache+DB.
    enabled: ${LINKFORGE_BLOOM_ENABLED:true}
    expected-insertions: ${LINKFORGE_BLOOM_EXPECTED_INSERTIONS:100000}
    fpp: ${LINKFORGE_BLOOM_FPP:0.0001}
  singleflight:
    # A10: merge concurrent same-code hot-path row reads into one in-flight DB read;
    # followers past wait-timeout do their own read (fail-open).
    enabled: ${LINKFORGE_SINGLEFLIGHT_ENABLED:true}
    wait-timeout-ms: ${LINKFORGE_SINGLEFLIGHT_WAIT_TIMEOUT_MS:500}
  l1:
    # B8: process-local Caffeine cache of URL strings in front of Redis. A hit saves
    # a Redis round-trip only — the DB row is still read per request for status.
    enabled: ${LINKFORGE_L1_ENABLED:true}
    maximum-size: ${LINKFORGE_L1_MAXIMUM_SIZE:10000}
    ttl-seconds: ${LINKFORGE_L1_TTL_SECONDS:10}
  api-key:
    # B4: per-key quotas fall back to these defaults; keys act as their creator.
    default-quota-per-minute: ${LINKFORGE_APIKEY_QUOTA_PER_MINUTE:120}
    default-quota-per-day: ${LINKFORGE_APIKEY_QUOTA_PER_DAY:10000}
    max-active-per-user: ${LINKFORGE_APIKEY_MAX_ACTIVE:10}
    max-quota-per-minute: ${LINKFORGE_APIKEY_MAX_QUOTA_PER_MINUTE:1000}
    max-quota-per-day: ${LINKFORGE_APIKEY_MAX_QUOTA_PER_DAY:100000}
  webhook:
    # B5: click webhooks built on the A7 outbox chain (consume -> delivery row -> relay).
    enabled: ${LINKFORGE_WEBHOOK_ENABLED:true}
    # Base64 of a 32-byte AES-256 master key; WITHOUT it the webhook feature degrades
    # off (endpoints cannot be saved, no deliveries are enqueued or signed).
    secret-master-key: ${LINKFORGE_WEBHOOK_SECRET_KEY:}
    relay-enabled: ${LINKFORGE_WEBHOOK_RELAY_ENABLED:true}
    relay-fixed-delay-ms: ${LINKFORGE_WEBHOOK_RELAY_FIXED_DELAY_MS:2000}
    relay-initial-delay-ms: ${LINKFORGE_WEBHOOK_RELAY_INITIAL_DELAY_MS:5000}
    relay-batch-size: ${LINKFORGE_WEBHOOK_RELAY_BATCH_SIZE:50}
    max-attempts: ${LINKFORGE_WEBHOOK_MAX_ATTEMPTS:8}
    backoff-base-seconds: ${LINKFORGE_WEBHOOK_BACKOFF_BASE_SECONDS:10}
    backoff-max-seconds: ${LINKFORGE_WEBHOOK_BACKOFF_MAX_SECONDS:3600}
    connect-timeout-ms: ${LINKFORGE_WEBHOOK_CONNECT_TIMEOUT_MS:2000}
    request-timeout-ms: ${LINKFORGE_WEBHOOK_REQUEST_TIMEOUT_MS:5000}
    # SSRF guard escape hatch — IT-only, never true in prod (D-Bw2-15).
    allow-private-targets: ${LINKFORGE_WEBHOOK_ALLOW_PRIVATE_TARGETS:false}
  mq:
    # A7: hot path writes lf_outbox (PENDING) in the click transaction; the relay
    # drains it to RabbitMQ. sync-click keeps the lf_click_log double write.
    async-click-enabled: ${LINKFORGE_ASYNC_CLICK_ENABLED:true}
    sync-click-enabled: ${LINKFORGE_SYNC_CLICK_ENABLED:true}
    relay-enabled: ${LINKFORGE_MQ_RELAY_ENABLED:true}
    relay-batch-size: ${LINKFORGE_MQ_RELAY_BATCH_SIZE:100}
    relay-fixed-delay-ms: ${LINKFORGE_MQ_RELAY_FIXED_DELAY_MS:2000}
    relay-initial-delay-ms: ${LINKFORGE_MQ_RELAY_INITIAL_DELAY_MS:3000}
    relay-max-attempts: ${LINKFORGE_MQ_RELAY_MAX_ATTEMPTS:30}
    reconcile-fixed-delay-ms: ${LINKFORGE_MQ_RECONCILE_FIXED_DELAY_MS:30000}
    reconcile-initial-delay-ms: ${LINKFORGE_MQ_RECONCILE_INITIAL_DELAY_MS:15000}
  bootstrap:
    enabled: true
    tenant-name: ${LINKFORGE_BOOTSTRAP_TENANT:demo}
    username: ${LINKFORGE_BOOTSTRAP_USERNAME:admin}
    password: ${LINKFORGE_BOOTSTRAP_PASSWORD}
  rate-limit:
    register-max: ${LINKFORGE_REGISTER_MAX:5}
    register-window-seconds: ${LINKFORGE_REGISTER_WINDOW_SECONDS:600}
    create-max: ${LINKFORGE_CREATE_RATE_MAX:30}
    create-window-seconds: ${LINKFORGE_CREATE_RATE_WINDOW_SECONDS:60}
    redirect-max: ${LINKFORGE_REDIRECT_RATE_MAX:300}
    redirect-window-seconds: ${LINKFORGE_REDIRECT_RATE_WINDOW_SECONDS:60}
    idempotency-ttl-seconds: ${LINKFORGE_IDEMPOTENCY_TTL_SECONDS:86400}
    # Honor X-Forwarded-For only when a trusted reverse proxy fronts the app.
    trust-xff: ${LINKFORGE_TRUST_XFF:false}
    key-prefix: ${LINKFORGE_RATELIMIT_KEY_PREFIX:linkforge:rl:}
  click-filter:
    # B2: prefetch headers and named preview bots get the normal 302 but record no click.
    enabled: ${LINKFORGE_CLICK_FILTER_ENABLED:true}
    prefetch-headers-enabled: ${LINKFORGE_CLICK_FILTER_PREFETCH_ENABLED:true}
    # comma-separated, whole-list override; keep out curl/wget/java/ generic bot tokens
    # (they would swallow drill scripts and integration tests, D-Bw345-3)
    bot-ua-tokens: ${LINKFORGE_CLICK_FILTER_BOT_UA_TOKENS:slackbot,slack-imgproxy,facebookexternalhit,facebookcatalog,twitterbot,telegrambot,whatsapp,discordbot,linkedinbot,skypeuripreview,pinterestbot,redditbot,embedly,iframely,googlebot,bingbot,bingpreview,applebot,yandexbot,duckduckbot,baiduspider}
  phishing:
    # B9: local domain blocklist/warnlist + userinfo rule; defaults stay empty on purpose.
    enabled: ${LINKFORGE_PHISHING_ENABLED:true}
    block-domains: ${LINKFORGE_PHISHING_BLOCK_DOMAINS:}
    warn-domains: ${LINKFORGE_PHISHING_WARN_DOMAINS:}
    blocklist-file: ${LINKFORGE_PHISHING_BLOCKLIST_FILE:}
    reload-interval-ms: ${LINKFORGE_PHISHING_RELOAD_INTERVAL:30000}
    reject-userinfo: ${LINKFORGE_PHISHING_REJECT_USERINFO:true}
  link-access:
    # B3: unlock cookie TTL and brute-force windows (rate limit runs before BCrypt)
    ttl-seconds: ${LINKFORGE_LINK_ACCESS_TTL_SECONDS:3600}
    unlock-ip-max: ${LINKFORGE_LINK_ACCESS_UNLOCK_IP_MAX:5}
    unlock-code-max: ${LINKFORGE_LINK_ACCESS_UNLOCK_CODE_MAX:50}
    unlock-window-seconds: ${LINKFORGE_LINK_ACCESS_UNLOCK_WINDOW_SECONDS:300}
  metrics:
    # B1: /actuator/prometheus accepts only this bearer token; empty = fail-closed 401
    scrape-token: ${LINKFORGE_METRICS_SCRAPE_TOKEN:}
    backlog-sample-interval-ms: ${LINKFORGE_METRICS_BACKLOG_INTERVAL:15000}

logging:
  level:
    com.linkforge: INFO
    com.baomidou.mybatisplus: WARN

---
spring:
  config:
    activate:
      on-profile: prod
  web:
    resources:
      # no static console in prod
      add-mappings: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
linkforge:
  docs-enabled: false
management:
  endpoint:
    health:
      show-details: when_authorized
      show-components: when_authorized
