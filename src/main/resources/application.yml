spring:
  application:
    name: linkforge
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    # Versioned migrations for every profile; empty DBs get V1, legacy volumes
    # (tables already present, no history) are baselined at 1 and skip V1.
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      show-components: always

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/linkforge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:linkforge}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:linkforge}
    password: ${SPRING_RABBITMQ_PASSWORD}
    listener:
      simple:
        # Consumer runs by default now that the real consumer is in place.
        auto-startup: ${LINKFORGE_MQ_LISTENER_AUTO_STARTUP:true}
        # Errored messages go to the dead-letter queue instead of hot-looping.
        default-requeue-rejected: ${LINKFORGE_MQ_DEFAULT_REQUEUE_REJECTED:false}
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: ${SERVER_PORT:8080}

linkforge:
  jwt:
    secret: ${JWT_SECRET}
    expire-hours: ${JWT_EXPIRE_HOURS:24}
  short-link:
    # Redis key: linkforge:code:{code} -> originalUrl
    cache-ttl-seconds: 3600
    code-length: 7
  mq:
    # A7: hot path writes lf_outbox (PENDING) in the click transaction; the relay
    # drains it to RabbitMQ. sync-click keeps the lf_click_log double write.
    async-click-enabled: ${LINKFORGE_ASYNC_CLICK_ENABLED:true}
    sync-click-enabled: ${LINKFORGE_SYNC_CLICK_ENABLED:true}
    relay-enabled: ${LINKFORGE_MQ_RELAY_ENABLED:true}
    relay-batch-size: ${LINKFORGE_MQ_RELAY_BATCH_SIZE:100}
    relay-fixed-delay-ms: ${LINKFORGE_MQ_RELAY_FIXED_DELAY_MS:2000}
    relay-initial-delay-ms: ${LINKFORGE_MQ_RELAY_INITIAL_DELAY_MS:3000}
    reconcile-fixed-delay-ms: ${LINKFORGE_MQ_RECONCILE_FIXED_DELAY_MS:30000}
    reconcile-initial-delay-ms: ${LINKFORGE_MQ_RECONCILE_INITIAL_DELAY_MS:15000}
  bootstrap:
    enabled: true
    tenant-name: ${LINKFORGE_BOOTSTRAP_TENANT:demo}
    username: ${LINKFORGE_BOOTSTRAP_USERNAME:admin}
    password: ${LINKFORGE_BOOTSTRAP_PASSWORD}
  rate-limit:
    register-max: ${LINKFORGE_REGISTER_MAX:5}
    register-window-seconds: ${LINKFORGE_REGISTER_WINDOW_SECONDS:600}
    create-max: ${LINKFORGE_CREATE_RATE_MAX:30}
    create-window-seconds: ${LINKFORGE_CREATE_RATE_WINDOW_SECONDS:60}
    redirect-max: ${LINKFORGE_REDIRECT_RATE_MAX:300}
    redirect-window-seconds: ${LINKFORGE_REDIRECT_RATE_WINDOW_SECONDS:60}
    idempotency-ttl-seconds: ${LINKFORGE_IDEMPOTENCY_TTL_SECONDS:86400}
    # Honor X-Forwarded-For only when a trusted reverse proxy fronts the app.
    trust-xff: ${LINKFORGE_TRUST_XFF:false}
    key-prefix: ${LINKFORGE_RATELIMIT_KEY_PREFIX:linkforge:rl:}

logging:
  level:
    com.linkforge: INFO
    com.baomidou.mybatisplus: WARN

---
spring:
  config:
    activate:
      on-profile: prod
  web:
    resources:
      # no static console in prod
      add-mappings: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
linkforge:
  docs-enabled: false
management:
  endpoint:
    health:
      show-details: when_authorized
      show-components: when_authorized
